<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schüttelbox und Zahlenhaus</title>
<meta name="description" content="Zahlzerlegung für die Grundschule mit Schüttelbox, Wendeplättchen oder Würfeln und dem Zahlenhaus – am Digiboard, Tablet oder Handy.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schüttelbox">
<meta name="theme-color" content="#EDF2F8">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Schrift Andika (SIL Open Font License, siehe fonts/OFL.txt) – lokal, ohne Google-Server */
@font-face{font-family:'Andika';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/andika-400.woff2) format('woff2')}
@font-face{font-family:'Andika';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/andika-700.woff2) format('woff2')}
:root{
  /* Farbcode wie im Schulbuch: --blue = linker Teil (rot), --red = rechter Teil (blau) */
  color-scheme: light;
  --bg:#EDF2F8; --paper:#FFFFFF; --ink:#1E2B45; --muted:#5B6782;
  --blue:#D6453B; --blue-t:#FBE3E0; --red:#2F6FDB; --red-t:#E2EBFB;
  --ball:#F2B33D; --ball-hi:#FFE6A3; --ball-edge:#B97E10;
  --box:#8597B6; --boxfill:rgba(255,255,255,.65); --lid:#6F82A3; --lid2:#7D90B0;
  --roof:#3D5A8C; --line:#C8D2E2; --ok:#24875A; --sel:#FFF1C9; --onink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#131A29; --paper:#1D2637; --ink:#EAF0FA; --muted:#A5B1C8;
    --blue:#F0837A; --blue-t:#43272A; --red:#77A3F2; --red-t:#203250;
    --ball:#F2B33D; --ball-hi:#FFE2A0; --ball-edge:#9C6A0C;
    --box:#6C7C99; --boxfill:rgba(255,255,255,.04); --lid:#4D5D7A; --lid2:#566785;
    --roof:#5A79B0; --line:#33405A; --ok:#3FAE74; --sel:#463A18; --onink:#131A29;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#131A29; --paper:#1D2637; --ink:#EAF0FA; --muted:#A5B1C8;
  --blue:#F0837A; --blue-t:#43272A; --red:#77A3F2; --red-t:#203250;
  --ball:#F2B33D; --ball-hi:#FFE2A0; --ball-edge:#9C6A0C;
  --box:#6C7C99; --boxfill:rgba(255,255,255,.04); --lid:#4D5D7A; --lid2:#566785;
  --roof:#5A79B0; --line:#33405A; --ok:#3FAE74; --sel:#463A18; --onink:#131A29;
}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Andika',"Comic Neue","Trebuchet MS",system-ui,-apple-system,sans-serif;font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ball);outline-offset:2px}

/* Kopfzeile */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px));max-width:1200px;margin:0 auto}
h1{font-size:1.2rem;margin:0;font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:9px;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--onink)}
.stepper{display:inline-flex;align-items:center;background:var(--paper);border:2px solid var(--line);border-radius:12px}
.stepper button{width:46px;height:46px;border:0;background:transparent;font-size:1.6rem;line-height:1}
#nIn{width:3.4ch;font:inherit;font-size:1.6rem;font-weight:700;text-align:center;border:0;background:transparent;color:var(--ink);-moz-appearance:textfield;appearance:textfield}
#nIn::-webkit-inner-spin-button,#nIn::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.tool{min-height:46px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;gap:6px}
#lockBtn{display:none}
body.kid #lockBtn{display:inline-flex}
body.kid .settings,body.kid #zrSeg,body.kid .stepper,body.kid #clearBtn,body.kid #houseBtn{display:none}
.legal{text-align:center;font-size:14px;color:var(--muted);padding:0 16px 20px}
.legal a{color:var(--muted);display:inline-block;padding:12px 6px}
body.kid .home{display:none}
a.tool{color:inherit;text-decoration:none}
.home svg{width:22px;height:22px;flex:none}
@media (max-width:1300px){.home .lbl{display:none}.home{min-width:46px;padding:0;justify-content:center}}

/* Einstellungen */
.settings{position:relative}
.settings summary{list-style:none}
.settings summary::-webkit-details-marker{display:none}
.panel{position:absolute;right:0;top:calc(100% + 8px);width:min(380px,calc(100vw - 24px));max-height:78vh;overflow-y:auto;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:6px 16px 16px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.panel h2{font-size:1rem;margin:16px 0 6px}
.panel label{display:flex;gap:10px;align-items:center;min-height:40px}
.panel input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue);flex:none}
.panel input[type=text]{font:inherit;width:100%;padding:6px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.linknote{background:var(--sel);border-radius:10px;padding:8px 12px;margin:12px 0 0;font-size:.9rem}
.linknote a{color:inherit}
.linkrow{display:flex;flex-wrap:wrap;gap:8px}
.linkout{display:block;width:100%;margin-top:8px;font:inherit;font-size:.8rem;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.panel .done{margin-top:18px;width:100%;justify-content:center;font-weight:700}
.vrow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)}
.vrow span{font-size:.9rem;flex:1}
.vrow button{min-width:42px;min-height:38px;border-radius:9px;border:2px solid var(--line);background:var(--bg);font-size:.9rem}
.vrow button.rec{border-color:var(--red);color:var(--red);font-weight:700}
.vrow .mark{color:var(--ok);font-weight:700}
@media (max-width:780px){
  .panel{position:fixed;left:12px;right:12px;top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;max-height:70vh;max-height:70dvh}
}

/* Bühne */
.stage{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:28px;padding:8px 20px 32px;max-width:1200px;margin:0 auto;align-items:start}
@media (max-width:780px){.stage{grid-template-columns:1fr;gap:22px;padding:6px 12px 24px}}
.boxside{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}

/* Partner */
.partnerbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.who{padding:6px 14px;border-radius:20px;border:2px solid var(--line);background:var(--paper)}
.who.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.who.on::after{content:" ist dran"}

/* Würfel */
.dicetray{display:flex;gap:12px;align-items:center;min-height:62px}
.die{width:58px;height:58px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px;gap:2px}
.die i{border-radius:50%}
.die i.on{background:var(--ink)}
.die.digit{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.die.digit b{font-size:1.8rem;line-height:1}
.die.digit small{font-size:.65rem;color:var(--muted)}
.die.rolling{animation:roll .14s linear infinite}
@keyframes roll{50%{transform:rotate(12deg) translateY(-4px)}}
.dsum{font-size:1.5rem;font-weight:700}

/* Schüttelbox */
.box{position:relative;display:grid;grid-template-columns:1fr 14px 1fr;width:100%;max-width:640px;padding:12px;border-radius:24px;background:var(--boxfill);border:5px solid var(--box);box-shadow:0 6px 0 var(--line)}
.divider{background:var(--box);border-radius:7px;margin:0 3px}
.chamber{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:10px;border-radius:14px;min-height:110px;overflow:hidden}
.chamber.l{background:var(--blue-t);box-shadow:inset 0 -6px 0 var(--blue)}
.chamber.r{background:var(--red-t);box-shadow:inset 0 -6px 0 var(--red)}
.balls{display:flex;flex-wrap:wrap-reverse;align-content:flex-start;margin-bottom:4px}
.ball{flex:none;border-radius:50%;background:radial-gradient(circle at 34% 30%,var(--ball-hi),var(--ball) 52%,var(--ball-edge));box-shadow:0 1px 1px rgba(0,0,0,.25)}
.ball.drop{animation:drop .45s cubic-bezier(.3,1.45,.5,1) both}
@keyframes drop{from{transform:translateY(-48px);opacity:0}to{transform:none;opacity:1}}
.shaking{animation:shake .65s ease-in-out}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-14px) rotate(-4deg)}30%{transform:translateX(12px) rotate(3deg)}45%{transform:translateX(-10px) rotate(-3deg)}60%{transform:translateX(8px) rotate(2deg)}78%{transform:translateX(-4px) rotate(-1deg)}}
.shaking .ball,.shaking .plate{animation:jit .15s linear infinite alternate}
@keyframes jit{to{transform:translate(3px,-9px)}}
.lid{position:absolute;inset:0;z-index:2;border:0;border-radius:14px;background:repeating-linear-gradient(135deg,var(--lid) 0 14px,var(--lid2) 14px 28px);color:#fff;font-size:3.4rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.lid.open{inset:6px 6px auto auto;padding:3px 10px;font-size:.8rem;font-weight:400;background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:8px}

/* Vor dem ersten Schütteln: Box zu, Plättchen grau – nichts vorwegnehmen */
.box.closed::after{content:"";position:absolute;inset:12px;z-index:2;border-radius:14px;background:repeating-linear-gradient(135deg,var(--lid) 0 14px,var(--lid2) 14px 28px)}
.box.closed .balls,.box.closed .lid{visibility:hidden}
.plates.closed .plate{background:var(--box)}

/* Zahl auf der Box */
.boxnum{position:absolute;top:-41px;left:50%;transform:translateX(-50%);min-width:72px;padding:0 18px;background:var(--paper);color:var(--ink);border:5px solid var(--box);border-bottom:0;border-radius:16px 16px 0 0;font-size:2rem;font-weight:700;text-align:center;line-height:36px;z-index:3}
.plates .boxnum{border-color:var(--line);border-width:3px;top:-39px}
.box.hasnum,.plates.hasnum{margin-top:40px}

/* Würfel in der Box */
.cdie{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);background:var(--paper);border:4px solid var(--blue);border-radius:18%;padding:11%;gap:5%;margin-bottom:8px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.chamber.r .cdie{border-color:var(--red)}
.cdie i{border-radius:50%}
.cdie i.on{background:var(--ink)}
.cdie.drop{animation:dieroll .55s cubic-bezier(.3,1.3,.5,1) both}
@keyframes dieroll{from{transform:translateY(-40px) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
.shaking .cdie{animation:jit .15s linear infinite alternate}

/* Wendeplättchen */
.plates{position:relative;width:100%;max-width:640px;padding:18px;background:var(--paper);border:3px solid var(--line);border-radius:20px;display:flex;justify-content:center;box-shadow:0 6px 0 var(--line)}
.pgrid{display:flex;flex-wrap:wrap;align-content:flex-start}
.plate{flex:none;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.plate.b{background:var(--blue)}
.plate.r{background:var(--red)}
.plate.flip{animation:flip .5s both}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:none}}

.tags{display:grid;grid-template-columns:1fr 14px 1fr;width:100%;max-width:640px;padding:0 17px;text-align:center;min-height:2.6rem}
.tag{font-size:2rem;font-weight:700;line-height:1.3}
.tag.l{color:var(--blue)}
.tag.r{color:var(--red);grid-column:3}
.shake{min-height:66px;padding:0 44px;font-size:1.45rem;font-weight:700;border-radius:34px;border:0;background:var(--ink);color:var(--onink);box-shadow:0 5px 0 var(--box)}
.shake:active{transform:translateY(3px);box-shadow:0 2px 0 var(--box)}
.eqrow{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;min-height:3rem}
.peek{min-height:44px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--paper)}
.eq{font-size:2.1rem;font-weight:700;margin:0;display:flex;gap:.35em;align-items:center}
.eq .l{color:var(--blue)}
.eq .r{color:var(--red)}
.eq i{font-style:normal;display:inline-block;min-width:1.5em;border:2px dashed var(--muted);border-radius:8px;text-align:center;line-height:1.2;color:var(--muted)}
.msg{display:flex;gap:10px;align-items:center;max-width:640px;width:100%;background:var(--paper);border-radius:14px;padding:8px 12px;border:2px solid var(--line);min-height:62px}
.msg p{margin:0;font-size:1.1rem}
#sayBtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg);flex:none;font-size:1.1rem}

/* Zahlenhaus */
.houseside{min-width:0}
.house{width:100%;max-width:330px;margin:0 auto}
.roof{height:104px;margin:0 -16px;background:var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;color:#fff;font-size:2.4rem;font-weight:700;line-height:1}
.hbody{background:var(--paper);border:4px solid var(--roof);border-top:0;max-height:min(56vh,520px);overflow-y:auto;overscroll-behavior:contain}
.hrow{display:grid;grid-template-columns:1fr 1fr;width:100%;border:0;background:transparent;padding:0;border-bottom:2px solid var(--line);text-align:center}
.hrow:last-child{border-bottom:0}
.hc{display:flex;align-items:center;justify-content:center;min-height:46px;font-size:1.6rem;font-weight:700;border:0;background:transparent;padding:0}
.hc.l{color:var(--blue);border-right:3px solid var(--roof)}
.hc.r{color:var(--red)}
.hrow.blank .hc{min-height:40px}
.hrow.sel{background:var(--sel)}
.hrow.swap{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--sel) 8px 12px)}
.hrow.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.06)}}
.step{display:grid;grid-template-columns:1fr 1fr;height:0;position:relative;z-index:1}
.step span{justify-self:center;transform:translateY(-50%);font-size:.8rem;font-weight:700;padding:0 7px;border-radius:9px;background:var(--paper);border:1.5px solid currentColor;line-height:1.35}
.step .l{color:var(--blue)}
.step .r{color:var(--red)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);margin:0}
.pending{background:var(--paper);border:4px solid var(--roof);border-top:3px dashed var(--roof);padding-top:6px}
.house.collapsed .roof,.house.collapsed .hbody{display:none}
.house.collapsed .pending{border-top:4px solid var(--roof)}
.houseoff{max-width:330px;margin:0 auto 12px;padding:22px 16px;border:3px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted)}
.houseoff p{margin:0 0 12px}
.plabel{margin:0 10px 4px;font-size:.95rem;color:var(--muted);text-align:center}
.prow{border-bottom:0}
.prow .hc{min-height:54px}
.prow .hc.in{background:var(--bg);box-shadow:inset 0 0 0 2px var(--muted);margin:4px;border-radius:8px}
.prow .hc.l.in{border-right:0}
.prow .hc.act{box-shadow:inset 0 0 0 4px var(--ball)}
.prow.nope{animation:nope .4s}
@keyframes nope{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.hfoot,.nbrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;max-width:330px;margin:10px auto 0;color:var(--muted);font-size:.95rem}
.nbrow,.hfoot{justify-content:center}
#count{flex-basis:100%;text-align:center}
.hfoot button,.nbrow button{min-height:40px;padding:0 12px;border-radius:10px;border:2px solid var(--line);background:var(--paper)}
.house.full .roof{animation:pop .7s 2}
/* Ansicht „Nur Haus“: von der Box bleiben nur Würfel und Ansage */
body.v-house .boxside > :not(.msg):not(.dicetray){display:none}
body.v-house .stage{grid-template-columns:1fr;max-width:560px}
body.v-house #houseBtn{display:none}
body.v-house .house{max-width:380px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:14px auto 0}
.keypad button{min-height:56px;font-size:1.5rem;border-radius:12px;border:2px solid var(--line);background:var(--paper)}
.keypad .ok{background:var(--ok);color:#fff;border-color:var(--ok);font-size:1.15rem}

/* Dialog */
.dlg{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.dlgbox{background:var(--paper);border-radius:18px;padding:20px;width:min(340px,100%);display:flex;flex-direction:column;gap:10px}
.dlgbox h2{margin:0;font-size:1.15rem}
.dlgbox p{margin:0}
#dlgIn{font:inherit;font-size:1.6rem;text-align:center;letter-spacing:.3em;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.dlgerr{color:var(--red);min-height:1.4em;font-size:.95rem}
.dlgbtns{display:flex;gap:10px;justify-content:flex-end}
.dlgbtns .ok{background:var(--ink);color:var(--onink);border-color:var(--ink);font-weight:700}
.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;align-self:flex-start;padding:4px 0}

/* Verbindungslinien */
#links{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;opacity:0;transition:opacity .4s}
#links.show{opacity:1}
.glow{animation:glow 1.8s}
@keyframes glow{30%{filter:brightness(1.12) drop-shadow(0 0 10px var(--ball))}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

/* ---------- Arbeitsblätter (A4, Druck über den Browser, auch schwarz-weiß) ---------- */
.sheets{position:fixed;inset:0;z-index:100;background:#4a5568;display:flex;flex-direction:column}
.sbar{background:var(--paper);color:var(--ink);border-bottom:2px solid var(--line);padding:10px max(14px,env(safe-area-inset-left,0px)) 12px;display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto}
.sbar .stop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sbar h2{margin:0;font-size:1.2rem;flex:1}
.sbar .srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sbar .slab{min-width:84px;font-size:.9rem;color:var(--muted)}
.sbar .tool[aria-pressed="true"]{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.sbar .print{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700;font-size:1.1rem;padding:0 22px}
.sbar label{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.sbar input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}
.sbar .sinfo{font-size:.85rem;color:var(--muted);margin:0}
#spages{--f:1;flex:1;overflow:auto;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:18px}
.swrap{width:calc(210mm * var(--f));height:calc(297mm * var(--f));flex:none;box-shadow:0 6px 24px rgba(0,0,0,.35);background:#fff}
.sheet{width:210mm;height:297mm;transform:scale(var(--f));transform-origin:top left;box-sizing:border-box;padding:12mm 14mm 10mm;background:#fff;color:#1f2937;position:relative;overflow:hidden;font-family:'Andika',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .nd{display:flex;justify-content:space-between;font-size:3.8mm;margin-bottom:4mm}
.sheet .ln{display:inline-block;border-bottom:.35mm solid #374151;vertical-align:bottom}
.sheet .sh{display:flex;align-items:center;gap:4mm;border-bottom:.7mm solid #1f2937;padding-bottom:2mm}
.sheet .sico{width:17mm;height:17mm;flex:none}

.landscape .swrap{width:calc(297mm * var(--f));height:calc(210mm * var(--f))}
.a5{width:148.5mm;height:210mm;overflow:hidden;position:relative}
.a5 .sheet{transform:scale(.70711)}
@media print{
  @page{size:A4 portrait;margin:0}
  :root,html,body{padding:0!important;background:#fff!important}
  body>*:not(#sheets){display:none!important}
  #sheets{position:static!important;display:block!important;background:#fff!important}
  #sheets .sbar{display:none!important}
  #spages{--f:1!important;display:block!important;padding:0!important;overflow:visible!important}
  .swrap{box-shadow:none!important;break-after:page;page-break-after:always}
  .swrap:last-child{break-after:auto;page-break-after:auto}
}

<body>
<header class="top">
  <a class="tool home" href="../" aria-label="Zur Startseite: alle Matheapps" title="Alle Apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg><span class="lbl">Alle Apps</span></a>
  <h1>Schüttelbox und Zahlenhaus</h1>

    <div class="stepper" role="group" aria-label="Zahl">

  </section>

<script>
(function(){
const $=s=>document.querySelector(s);
const KEY='schuettelbox-v2', VKEY='schuettelbox-voice';
const DEF={view:'both',zero:true,zr:10,n:7,hide:'none',mode:'auto',rand:'real',eq:'button',tags:false,house:true,links:true,sorted:false,empty:true,pattern:false,sound:true,speak:false,boxnum:true,material:'box',diceTarget:'roof',partner:false,names:['Kind 1','Kind 2'],kid:false,code:''};
let S={...DEF};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null'); if(v){ S={...DEF,...v}; if(!('view' in v)&&v.house===false) S.view='box'; }}catch(e){}
function save(){ if(LINK) return; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

/* ---------- Einstellungen per Link ----------
   z. B. ?zahl=7&material=plaettchen&haus=1 – gilt nur für diese Sitzung, wird nicht gespeichert.
   Namen und Lehrkraft-Code kommen nie in den Link. */
const B01=[['1',true],['0',false]];
const LP=[
  ['zr','zr',[['10',10],['20',20],['100',100]]],
  ['material','material',[['box','box'],['plaettchen','plates'],['wuerfel','dice']]],
  ['kammern','hide',[['offen','none'],['links','left'],['rechts','right'],['beide','both'],['zufall','random']]],
  ['eintragen','mode',[['auto','auto'],['kinder','self']]],
  ['plus','eq',[['knopf','button'],['immer','always'],['aus','off']]],
  ['wuerfel','diceTarget',[['dach','roof'],['kammer','chamber']]],
  ['kugeln','rand',[['echt','real'],['gleich','uniform']]],
  ['ansicht','view',[['beide','both'],['box','box'],['haus','house']]],['null','zero',B01],
  ['boxzahl','boxnum',B01],['ordnen','sorted',B01],['leer','empty',B01],['muster','pattern',B01],
  ['anzahl','tags',B01],['linien','links',B01],['ton','sound',B01],['vorlesen','speak',B01],['partner','partner',B01],['kinder','kid',B01]
];
const LALIAS={n:'zahl',mat:'material'};
const LINK=(()=>{
  let q; try{ q=new URLSearchParams(location.search); }catch(e){ return false; }
  const get=k=>{ if(q.has(k)) return q.get(k); for(const a in LALIAS) if(LALIAS[a]===k&&q.has(a)) return q.get(a); return null; };
  if(!LP.some(([p])=>get(p)!==null)&&get('zahl')===null&&get('haus')===null) return false;
  S={...DEF,names:[...DEF.names],mig3:true};
  LP.forEach(([p,k,opts])=>{ const v=get(p); if(v===null) return; const m=opts.find(o=>o[0]===v.trim().toLowerCase()); if(m) S[k]=m[1]; });
  const n=parseInt(get('zahl'),10); if(n>0) S.n=n;
  if(get('ansicht')===null&&get('haus')==='0') S.view='box'; // ältere Links
  if(S.pattern) S.sorted=true;
  return true;
})();
function linkURL(kid){
  const parts=['zahl='+S.n];
  LP.forEach(([p,k,opts])=>{ if(k==='kid') return; if(S[k]!==DEF[k]){ const m=opts.find(o=>o[1]===S[k]); if(m) parts.push(p+'='+m[0]); } });
  if(kid) parts.push('kinder=1');
  return location.origin+location.pathname+'?'+parts.join('&');
}
if(!S.mig3){ S.sorted=false; S.pattern=false; S.mig3=true; save(); }
let voices={}; try{voices=JSON.parse(localStorage.getItem(VKEY)||'{}')||{};}catch(e){}

let left=0,right=0,plates=[],shaken=false,hid={left:false,right:false},open={left:false,right:false},eqShown=false,busy=false;
let rows=[],pending=null,selectedA=null,lastMsg='',lastClip=null,msgSeq=0,dice=null,motionOn=false,gotMotion=false;
let turn=0,phase='shake',impulseShown=false;
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const rnd=k=>Math.floor(Math.random()*k);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usePlates=()=>S.material==='plates'&&!S.partner;
const useDice=()=>S.material==='dice';
const possible=a=>(S.zero||(a>=1&&S.n-a>=1))&&(!useDice()||(a>=1&&a<=6&&S.n-a>=1&&S.n-a<=6));
const houseOn=()=>S.view!=='box', houseOnly=()=>S.view==='house';
const minN=()=>useDice()||!S.zero?2:1;
const isFull=()=>rows.length>=possibleList().length;
const possibleList=()=>Array.from({length:S.n+1},(_,a)=>a).filter(possible);
const NONE=()=>({left:false,right:false});
const pickHide=()=>{
  if(usePlates()||S.partner) return NONE();
  const h=S.hide; if(h==='random'){ const l=Math.random()<.5; return {left:l,right:!l}; }
  return {left:h==='left'||h==='both',right:h==='right'||h==='both'};
};
const visible=side=>!hid[side]||open[side];
const revealAll=()=>{ open={left:true,right:true}; };
const nameA=()=>S.names[turn]||'Kind 1', nameB=()=>S.names[1-turn]||'Kind 2';

function split(){
  if(useDice()){ const l=possibleList(); return l.length?l[rnd(l.length)]:0; }
  if(S.rand==='uniform') return S.zero||S.n<2?rnd(S.n+1):1+rnd(S.n-1);
  for(let t=0;t<60;t++){ let a=0; for(let i=0;i<S.n;i++) if(Math.random()<.5) a++; if(S.zero||possible(a)) return a; }
  return 1+rnd(Math.max(1,S.n-1));
}
function makePlates(a){
  const arr=Array.from({length:S.n},(_,i)=>i<a);
  for(let i=arr.length-1;i>0;i--){ const j=rnd(i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function setSplit(a){ left=a; right=S.n-a; plates=makePlates(a); }

/* ---------- Kopf ---------- */
function renderZR(){
  const seg=$('#zrSeg'); seg.innerHTML='';
  [10,20,100].forEach(z=>{
    const b=document.createElement('button'); b.type='button'; b.textContent='bis '+z;
    b.setAttribute('aria-pressed',S.zr===z); b.onclick=()=>{S.zr=z; $('#diceTray').hidden=true; setN(Math.min(S.n,z));};
    seg.appendChild(b);
  });
  const inp=$('#nIn'); inp.max=S.zr; if(document.activeElement!==inp) inp.value=S.n;
  document.body.classList.toggle('kid',!!S.kid);
}

/* ---------- Material ---------- */
function grid(w){
  const n=S.n, cols=n<=20?5:10;
  const max=n<=10?44:n<=20?34:22, gap=n<=20?6:3, extra=n<=20?9:6;
  let size=Math.floor((w-(cols-1)*gap-(cols===10?extra:0))/cols);
  size=Math.max(7,Math.min(max,size));
  const rowsN=Math.ceil(n/cols), tens=cols===5?(n>10?1:0):(n>50?1:0);
  return {cols,size,gap,extra,h:rowsN*size+(rowsN-1)*gap+tens*extra,w:cols*size+(cols-1)*gap+(cols===10?extra:0)};
}
function structure(el,i,L,vert){
  if(L.cols===5&&i>=10&&i<15) el.style[vert]=L.extra+'px';
  if(L.cols===10){ if(i%10===4) el.style.marginRight=L.extra+'px'; if(i>=50&&i<60) el.style[vert]=L.extra+'px'; }
}
function fill(el,count,L,drop){
  el.innerHTML=''; el.style.width=L.w+'px'; el.style.gap=L.gap+'px';
  for(let i=0;i<count;i++){
    const b=document.createElement('span'); b.className='ball';
    b.style.width=b.style.height=L.size+'px'; structure(b,i,L,'marginBottom');
    if(drop){ b.classList.add('drop'); b.style.animationDelay=rnd(200)+'ms'; }
    el.appendChild(b);
  }
}
function dieIn(el,c,ch,drop){
  el.innerHTML=''; el.style.width=''; el.style.gap='';
  const size=Math.max(56,Math.min(130,Math.floor((ch.clientWidth-20)*.7)));
  const d=document.createElement('div'); d.className='cdie'+(drop?' drop':'');
  d.style.width=d.style.height=size+'px';
  d.innerHTML=Array.from({length:9},(_,k)=>`<i class="${(PIPS[c]||[]).includes(k)?'on':''}"></i>`).join('');
  d.setAttribute('role','img'); d.setAttribute('aria-label',c===1?'1 Auge':c+' Augen'); el.appendChild(d);
  return size;
}
function renderBox(drop){
  const dm=useDice(), L=dm?null:grid($('#chL').clientWidth-20);
  [['#chL',left,'left','#lidL','links'],['#chR',right,'right','#lidR','rechts']].forEach(([id,c,side,lidId,word])=>{
    const ch=$(id);
    if(dm){ const s=dieIn(ch.querySelector('.balls'),c,ch,drop); ch.style.minHeight=(s+36)+'px'; }
    else { ch.style.minHeight=(L.h+28)+'px'; fill(ch.querySelector('.balls'),c,L,drop); }
    /* Lösungsschutz: Was unter dem Deckel liegt, darf auch keine Vorlesehilfe
       (VoiceOver, „Bildschirminhalt sprechen“) finden – sonst liest sie z. B. „4 Augen“ vor. */
    const balls=ch.querySelector('.balls'), secret=!shaken||!visible(side);
    balls.setAttribute('aria-hidden',String(secret)); balls.inert=secret;
    const lid=$(lidId); lid.hidden=!hid[side];
    lid.classList.toggle('open',open[side]);
    lid.textContent=open[side]?'Zudecken':'?';
    lid.setAttribute('aria-label',open[side]?'Kammer '+word+' zudecken':'Kammer '+word+' aufdecken');
  });
}
function renderPlates(drop){
  const cont=$('#plates'), g=cont.querySelector('.pgrid');
  const L=grid(Math.min(cont.clientWidth-36,S.n<=20?320:560));
  L.size=Math.min(L.size*1.25|0,S.n<=10?52:S.n<=20?40:26); L.gap=Math.max(L.gap,S.n<=20?8:4);
  const w=L.cols*L.size+(L.cols-1)*L.gap+(L.cols===10?L.extra:0);
  g.innerHTML=''; g.style.width=w+'px'; g.style.gap=L.gap+'px';
  plates.forEach((blue,i)=>{
    const p=document.createElement('span'); p.className='plate '+(blue?'b':'r');
    p.style.width=p.style.height=L.size+'px'; structure(p,i,L,'marginTop');
    if(drop){ p.classList.add('flip'); p.style.animationDelay=rnd(220)+'ms'; }
    g.appendChild(p);
  });
}
function renderMaterial(drop){
  const pl=usePlates(); $('#box').hidden=pl; $('#plates').hidden=!pl;
  $('#boxN').textContent=$('#platesN').textContent=S.n;
  $('#boxN').hidden=$('#platesN').hidden=!S.boxnum;
  $('#box').classList.toggle('hasnum',!!S.boxnum); $('#plates').classList.toggle('hasnum',!!S.boxnum);
  $('#box').classList.toggle('closed',!shaken); $('#plates').classList.toggle('closed',!shaken);
  if(pl) renderPlates(drop); else renderBox(drop);
  const selfPending=pending&&(S.mode==='self'||S.partner);
  const tag=side=>(!shaken||!S.tags||selfPending)?'':(visible(side)?(side==='left'?left:right):'?');
  $('#tagL').textContent=tag('left'); $('#tagR').textContent=tag('right');
}
function renderEq(){
  const e=$('#eq'), btn=$('#eqBtn');
  const can=S.eq!=='off'&&shaken;
  btn.hidden=!(can&&S.eq==='button');
  btn.textContent=eqShown?'Plusaufgabe ausblenden':'Plusaufgabe zeigen';
  if(!(can&&(S.eq==='always'||eqShown))){e.innerHTML='';return;}
  if(pending&&S.mode==='self'&&!S.partner){e.innerHTML=`<span>${S.n}</span>=<i>?</i>+<i>?</i>`;return;}
  const a=visible('left')?`<span class="l">${left}</span>`:'<i>?</i>';
  const b=visible('right')?`<span class="r">${right}</span>`:'<i>?</i>';
  e.innerHTML=`<span>${S.n}</span>=${a}+${b}`;
}
function renderPartner(){
  const pb=$('#partnerBar'); pb.hidden=!S.partner; if(!S.partner){pb.innerHTML='';return;}
  const actor=phase==='answer'?1-turn:turn;
  pb.innerHTML=S.names.map((n,i)=>`<span class="who${i===actor?' on':''}">${esc(n)}</span>`).join('')+
    (phase==='cover'?'<button class="peek" type="button" data-c="left">Links zudecken</button><button class="peek" type="button" data-c="right">Rechts zudecken</button>':'');
  pb.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>cover(b.dataset.c));
}

/* ---------- Haus ---------- */
function renderHouse(){
  $('#house').classList.toggle('collapsed',!houseOn());
  $('#houseOff').hidden=houseOn(); $('#nbrow').hidden=!houseOn();
  $('#houseBtn').textContent=houseOn()?'Haus ausblenden':'Haus einblenden';
  $('#patBtn').textContent=S.pattern?'Muster ausblenden':'Muster zeigen';
  $('#sortBtn').textContent=S.sorted?'Wie gefunden':'Haus ordnen';
  $('#plusOne').textContent=houseOnly()?'+1 rechts':useDice()?'+1 Auge':'+1 Kugel'; $('#minusOne').textContent=houseOnly()?'−1 rechts':useDice()?'−1 Auge':'−1 Kugel';
  $('#roofN').textContent=S.n;
  const hb=$('#hbody'); hb.innerHTML='';
  let list=[...rows]; if(S.sorted) list.sort((x,y)=>x.a-y.a);
  const tpl=S.sorted&&S.empty&&S.n<=20;
  const items=tpl?possibleList().map(a=>rows.find(r=>r.a===a)||{a,b:S.n-a,blank:true}):list;
  if(!items.length) hb.innerHTML=houseOnly()?'<p class="empty">Noch leer. Welche Zerlegung findest du?</p>':'<p class="empty">Noch leer. Schüttle die Box!</p>';
  let prev=null;
  items.forEach(r=>{
    if(S.pattern&&S.sorted&&prev&&!prev.blank&&!r.blank&&r.a===prev.a+1){
      const st=document.createElement('div'); st.className='step'; st.setAttribute('aria-hidden','true');
      st.innerHTML='<span class="l">+1</span><span class="r">−1</span>'; hb.appendChild(st);
    }
    const el=document.createElement(r.blank?'div':'button');
    let cls='hrow'; if(r.blank) cls+=' blank';
    if(!r.blank&&selectedA!==null){ if(r.a===selectedA) cls+=' sel'; else if(r.a===S.n-selectedA) cls+=' swap'; }
    el.className=cls; el.dataset.a=r.a;
    el.innerHTML=r.blank?'<span class="hc l"></span><span class="hc r"></span>':`<span class="hc l">${r.a}</span><span class="hc r">${r.b}</span>`;
    if(!r.blank){ el.type='button'; el.setAttribute('aria-label',`${r.a} und ${r.b}, zeigen`); el.onclick=()=>selectRow(r); }
    hb.appendChild(el); prev=r;
  });
  const p=$('#pending');
  if(pending){
    p.hidden=false;
    const cell=k=>{
      const need=pending.need[k], cls=`hc ${k==='a'?'l':'r'}${need?' in':''}${need&&pending.active===k?' act':''}`;
      return `<button type="button" class="${cls}" data-k="${k}" ${need?'':'tabindex="-1"'} aria-label="${k==='a'?'links':'rechts'}">${need?pending.val[k]:pending[k]}</button>`;
    };
    const lbl=pending.free?'Welche Zerlegung fehlt noch?':pending.need.a&&pending.need.b?'Wie viele liegen links, wie viele rechts?':'Wie viele fehlen?';
    p.innerHTML=`<p class="plabel">${lbl}</p><div class="hrow prow">${cell('a')}${cell('b')}</div>`;
    p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ if(pending.need[b.dataset.k]){pending.active=b.dataset.k; renderHouse();} });
  } else { p.hidden=true; p.innerHTML=''; }
  $('#keypad').hidden=!pending;
  $('#count').textContent=S.sorted?`${rows.length} von ${possibleList().length} Zerlegungen`:`${rows.length} ${rows.length===1?'Zerlegung':'Zerlegungen'} gefunden`;
}
function renderAll(drop){
  document.body.classList.toggle('v-house',houseOnly()); document.body.classList.toggle('v-box',!houseOn());
  // Nur Haus: es gibt immer eine leere Zeile zum Eintragen, bis das Haus voll ist
  if(houseOnly()&&!pending&&!isFull()) pending={free:true,a:null,b:null,need:{a:true,b:true},val:{a:'',b:''},active:'a'};
  if(!houseOnly()&&pending&&pending.free) pending=null;
  renderZR(); renderPartner(); renderMaterial(!!drop); renderEq(); renderHouse(); }

/* ---------- Ablauf ---------- */
function setN(v){
  v=Math.max(minN(),Math.min(useDice()?Math.min(12,S.zr):S.zr,Math.round(+v||1)));
  S.n=v; save();
  rows=[]; pending=null; selectedA=null; shaken=false; eqShown=false; impulseShown=false;
  hid=pickHide(); open=NONE(); phase='shake'; setSplit(split());
  hideLinks(); renderAll(false);
  setMsg(houseOnly()?`Welche Zerlegungen von ${S.n} findest du? Trag sie ins Haus ein.`:S.partner?`${nameA()}: Schüttle die Box!`:'Schüttle die Box!',false,houseOnly()?null:'shake');
}
function shake(){
  if(busy||houseOnly()) return; busy=true; rattle(); hideLinks();
  const el=usePlates()?$('#plates'):$('#box');
  el.classList.remove('shaking'); void el.offsetWidth; el.classList.add('shaking');
  setTimeout(()=>{ el.classList.remove('shaking'); setSplit(split()); shaken=true; busy=false; afterShake(); },650);
}
function addRow(a){ if(rows.some(r=>r.a===a)) return false; rows.push({a,b:S.n-a}); return true; }
function later(fn,ms){ const s=msgSeq; setTimeout(()=>{ if(s===msgSeq) fn(); },ms); }
function afterAdd(isNew){
  if(!isNew) return;

  const th=Math.min(5,Math.ceil(P/2));
  if(!impulseShown&&S.n>=4&&rows.length>=th){ impulseShown=true; later(()=>setMsg(S.sorted?'Fehlen noch welche? Wie kannst du sicher sein? Tipp: Schau dir das Muster im Haus an.':'Fehlen noch welche? Wie kannst du sicher sein? Sprecht darüber und ordnet dann das Haus.',true,'missing'),1700); }
}
function afterShake(){
  open=NONE(); eqShown=false; pending=null; selectedA=null;
  if(S.partner){
    hid=NONE(); phase='cover'; renderAll(true);
    setMsg(`${nameA()}: Schau genau hin und decke eine Kammer zu. Dann gib das Gerät an ${nameB()}.`,true,'cover');
    return;
  }
  hid=pickHide();
  const needA=S.mode==='self'||hid.left, needB=S.mode==='self'||hid.right;
  if(!needA&&!needB){
    const isNew=addRow(left); selectedA=left; renderAll(true); highlightRow(left);
    setMsg(isNew?`Links ${left}, rechts ${right}.`:`${left} und ${right} steht schon im Haus.`,true,isNew?null:'already');
    afterAdd(isNew);
  } else {
    pending={a:left,b:right,need:{a:needA,b:needB},val:{a:'',b:''},active:needA?'a':'b'};
    renderAll(true);
    if(S.mode==='self'&&!hid.left&&!hid.right) setMsg('Zähle: Wie viele liegen links, wie viele rechts?',true,'count');
    else if(hid.left&&hid.right) setMsg('Beide Kammern sind zu. Wie viele liegen links, wie viele rechts?',true,'count');
    else if(S.mode==='self') setMsg('Nicht alles ist zu sehen. Wie viele liegen links, wie viele rechts?',true,'count');
    else setMsg(hid.left?`Rechts ${right}. Wie viele sind links versteckt?`:`Links ${left}. Wie viele sind rechts versteckt?`,true,'hidden');
  }
}
function cover(side){
  if(phase!=='cover') return;
  hid={left:side==='left',right:side==='right'}; open=NONE(); phase='answer';
  pending={a:left,b:right,need:{a:side==='left',b:side==='right'},val:{a:'',b:''},active:side==='left'?'a':'b'};
  renderAll(false);
  setMsg(`${nameB()}: Wie viele sind versteckt?`,true,'hidden');
}
function chamberRound(v){
  setSplit(v); left=v; right=S.n-v; shaken=true; open=NONE(); eqShown=false; selectedA=null;
  hid=usePlates()?NONE():{left:false,right:true}; phase=S.partner?'answer':'shake';
  pending={a:v,b:S.n-v,need:{a:false,b:true},val:{a:'',b:''},active:'b'};
  hideLinks(); renderAll(true);
  setMsg(houseOnly()?`Links steht ${v}. Wie viele fehlen bis ${S.n}?`:usePlates()?`${v} Plättchen sind rot. Wie viele sind blau?`:`Links liegen ${v}. Wie viele fehlen bis ${S.n}?`,true,'hidden');
}
function key(k){
  if(!pending) return;
  if(k==='ok') return check();
  const f=pending.active; if(!pending.need[f]) return;
  const maxLen=String(S.n).length; let v=pending.val[f];
  if(k==='del') v=v.slice(0,-1);
  else if(v==='0') v=k;
  else if(v.length<maxLen) v+=k;

}
function check(){
  if(!pending) return;

  if(pending.free) return checkFree();
  const ok={a:true,b:true}; let all=true;
  for(const k of ['a','b']) if(pending.need[k]){ ok[k]=+pending.val[k]===pending[k]; if(!ok[k]) all=false; }
  if(all){
    revealAll(); const a=pending.a; const isNew=addRow(a); selectedA=a; pending=null;
    let extra='';
    if(S.partner){ turn=1-turn; phase='shake'; extra=` Jetzt ist ${nameA()} dran: Schüttle die Box.`; }
    renderAll(false); highlightRow(a);
    setMsg((isNew?`Richtig! ${left} und ${right} sind ${S.n}.`:`Richtig! ${left} und ${right} steht schon im Haus.`)+extra,true,'correct');
    afterAdd(isNew);
  } else {
    for(const k of ['a','b']) if(pending.need[k]&&!ok[k]) pending.val[k]='';
    pending.active=(pending.need.a&&!ok.a)?'a':'b';
    renderHouse(); const pr=document.querySelector('.prow'); if(pr) pr.classList.add('nope');

}
function checkFree(){
  const a=+pending.val.a, b=+pending.val.b;
  const again=()=>{ pending.val={a:'',b:''}; pending.active='a'; renderHouse(); const pr=document.querySelector('.prow'); if(pr) pr.classList.add('nope'); };
  if(a+b!==S.n){ again(); setMsg(`${a} und ${b} sind zusammen nicht ${S.n}. Probier es noch einmal.`,true); return; }
  if(!possible(a)){ again(); setMsg(useDice()?`${a} und ${b} geht mit zwei Würfeln nicht. Findest du eine andere?`:'Heute ohne 0. Findest du eine andere Zerlegung?',true); return; }
  if(rows.some(r=>r.a===a)){ pending.val={a:'',b:''}; pending.active='a'; selectedA=a; renderHouse(); highlightRow(a); setMsg(`${a} und ${b} steht schon im Haus. Findest du eine andere?`,true,'already'); return; }
  addRow(a); selectedA=a; pending=null; renderAll(false); highlightRow(a);
  setMsg(`Richtig! ${a} und ${b} sind ${S.n}.`,true,'correct');
  afterAdd(true);
}
function selectRow(r){
  if(busy) return;
  pending=null; setSplit(r.a); shaken=true; revealAll(); selectedA=r.a;
  if(S.partner) phase='shake';
  renderAll(false); highlightRow(r.a);
  setMsg(r.a===r.b?`${r.a} und ${r.b} sind ${S.n}. Diese Zerlegung hat keinen Tauschpartner.`:`${r.a} und ${r.b} sind ${S.n}. Der Tauschpartner ist ${r.b} und ${r.a}.`,true);
}
function highlightRow(a){
  const el=document.querySelector(`.hrow[data-a="${a}"]:not(.blank)`); if(!el) return;
  const hb=$('#hbody'); const top=el.offsetTop-hb.offsetTop;
  if(top<hb.scrollTop||top+el.offsetHeight>hb.scrollTop+hb.clientHeight) hb.scrollTop=top-hb.clientHeight/2;

}
function full(){
  later(()=>setMsg(`Das Haus ist voll! Alle ${possibleList().length} Zerlegungen gefunden.`,true,'full'),1100);
  const h=$('#house'); h.classList.remove('full'); void h.offsetWidth; h.classList.add('full');
}
/* Nachbarhäuser */
function plusOne(){
  const max=useDice()?Math.min(12,S.zr):S.zr;
  if(S.n>=max){ setMsg(useDice()?'Mit zwei Würfeln geht höchstens 12.':`Mehr als ${S.zr} geht im Zahlenraum bis ${S.zr} nicht.`,true); return; }
  const old=S.n; S.n++; save();
  rows=rows.map(r=>({a:r.a,b:r.b+1})).filter(r=>possible(r.a));
  if(useDice()&&right>=6) left+=1; else right+=1;
  plates.splice(rnd(plates.length+1),0,false);
  pending=null; impulseShown=true; if(selectedA!==null&&!rows.some(r=>r.a===selectedA)) selectedA=null;
  hideLinks(); renderAll(false);
  if(houseOnly()) setMsg(`Rechts immer eins mehr: Aus jeder Zerlegung von ${old} wird eine von ${S.n}. Welche fehlt jetzt noch?`,true); else
  setMsg(useDice()?`Ein Auge mehr auf dem rechten Würfel: Aus den Zerlegungen von ${old} werden Zerlegungen von ${S.n}. Welche fehlt jetzt noch?`:`Eine Kugel mehr in die rechte Kammer: Aus jeder Zerlegung von ${old} wird eine von ${S.n}. Welche fehlt jetzt noch?`,true);
}
function minusOne(){
  if(S.n<=minN()) return;

  const minR=useDice()?1:0;
  if(right>minR){ right--; const i=plates.lastIndexOf(false); if(i>=0) plates.splice(i,1); } else { left--; const i=plates.lastIndexOf(true); if(i>=0) plates.splice(i,1); }
  pending=null; impulseShown=true; if(selectedA!==null&&!rows.some(r=>r.a===selectedA)) selectedA=null;
  hideLinks(); renderAll(false);
  if(houseOnly()) setMsg(`Rechts immer eins weniger: Aus den Zerlegungen von ${old} werden Zerlegungen von ${S.n}. ${S.zero?old+' und 0':(old-1)+' und 1'} fällt weg.`,true); else
  setMsg(useDice()?`Ein Auge weniger: Aus den Zerlegungen von ${old} werden Zerlegungen von ${S.n}.`:`Rechts eine Kugel weniger: Aus den Zerlegungen von ${old} werden Zerlegungen von ${S.n}. ${S.zero?old+' und 0':(old-1)+' und 1'} fällt weg.`,true);
}

let linkT;

function drawLinks(rowEl){

  const svg=$('#links'), W=innerWidth, H=innerHeight; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);

/* ---------- Würfel ---------- */
function diceSpec(){
  const ch=S.diceTarget==='chamber';
  if(S.zr===10) return {type:'pip',count:ch?1:2};
  if(S.zr===20) return {type:'pip',count:ch?2:3};
  return {type:'digit',count:2};
}
const total=()=>dice.sp.type==='pip'?dice.vals.reduce((s,v)=>s+v,0):dice.vals[0]*10+dice.vals[1];
function renderDice(rolling){
  const tray=$('#diceTray'); tray.hidden=false; tray.innerHTML='';
  dice.vals.forEach((v,i)=>{
    const d=document.createElement('div'); d.className='die'+(rolling?' rolling':'');
    if(dice.sp.type==='pip') d.innerHTML=Array.from({length:9},(_,k)=>`<i class="${PIPS[v].includes(k)?'on':''}"></i>`).join('');
    else { d.classList.add('digit'); d.innerHTML=`<b>${v}</b><small>${i===0?'Zehner':'Einer'}</small>`; }
    d.setAttribute('role','img'); d.setAttribute('aria-label',String(v)); tray.appendChild(d);
  });
  if(!rolling&&dice.vals.length>1){ const s=document.createElement('span'); s.className='dsum'; s.textContent='= '+total(); tray.appendChild(s); }
}
function roll(){
  if(busy) return; busy=true;
  const sp=diceSpec(); let t=0;
  const iv=setInterval(()=>{
    dice={sp,vals:Array.from({length:sp.count},()=>sp.type==='pip'?1+rnd(6):rnd(10))};
    renderDice(true);
    if(++t>=8){
      clearInterval(iv); busy=false; renderDice(false);
      const v=total();
      if(S.diceTarget==='chamber'){
        if(v>S.n){ setMsg(`${v} ist mehr als ${S.n}. So viele passen nicht in die Box. Würfle noch einmal.`,true); return; }
        if(!S.zero&&v===S.n){ setMsg(`Dann bliebe rechts nichts übrig. Heute ohne 0. Würfle noch einmal.`,true); return; }
        if(useDice()&&!possible(v)){ setMsg(`Dann bräuchte der rechte Würfel ${S.n-v} Augen. Das geht nicht. Würfle noch einmal.`,true); return; }
        chamberRound(v);
      } else {
        if(v<1||v>S.zr){ setMsg(`${v} passt nicht in den Zahlenraum bis ${S.zr}. Würfle noch einmal.`,true); return; }
        if(useDice()&&(v<2||v>12)){ setMsg(`${v} lässt sich nicht mit zwei Würfeln zeigen. Würfle noch einmal.`,true); return; }
        setN(v); if(houseOnly()) setMsg(`Gewürfelt: ${v}. Welche Zerlegungen findest du?`,true); else setMsg(`Gewürfelt: ${v}. ${S.partner?nameA()+': ':''}Schüttle die Box!`,true,'shake');
      }
    }
  },70);
}

/* ---------- Ton, Sprache, eigene Ansagen ---------- */
let ac;
function rattle(){
  if(!S.sound) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const dur=.62, sr=ac.sampleRate, buf=ac.createBuffer(1,Math.floor(sr*dur),sr), d=buf.getChannelData(0);
    const clicks=Math.min(70,10+S.n*2);
    for(let c=0;c<clicks;c++){ const t=rnd(d.length-700), amp=.25+Math.random()*.5; for(let i=0;i<600;i++) d[t+i]+=(Math.random()*2-1)*amp*Math.exp(-i/80); }
    const src=ac.createBufferSource(); src.buffer=buf;
    const f=ac.createBiquadFilter(); f.type=usePlates()?'highpass':'bandpass'; f.frequency.value=usePlates()?3500:2600; f.Q.value=.8;
    const g=ac.createGain(); g.gain.value=.55;
    src.connect(f).connect(g).connect(ac.destination); src.start();
  }catch(e){}
}
function tts(t){
  if(!('speechSynthesis' in window)||!t) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t); u.lang='de-DE'; u.rate=.9;
    const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('de')); const v=vs.find(v=>v.localService)||vs[0]; if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speak(){
  if(lastClip&&voices[lastClip]){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); new Audio(voices[lastClip]).play(); return; }catch(e){} }
  tts(lastMsg);
}
/* Lösungsschutz (docs/vorlesen.md, Punkt 3): Vorgelesen werden nur feste Sätze aus setMsg,
   nie Text aus der Box, dem Haus oder der Plusaufgabe. Sätze nennen nur, was sichtbar ist
   („Rechts 4. Wie viele sind links versteckt?“), nie die versteckte Zahl. */
function setMsg(t,auto,clip){ msgSeq++; lastMsg=t; lastClip=clip||null; $('#msg').textContent=t; if(auto&&S.speak) speak(); }

const CLIPS=[['shake','Schüttle die Box!'],['correct','Richtig!'],['wrong','Noch nicht. Zähl noch einmal nach.'],['hidden','Wie viele sind versteckt?'],['count','Wie viele liegen links, wie viele rechts?'],['already','Das steht schon im Haus.'],['missing','Fehlen noch welche? Wie kannst du sicher sein?'],['full','Das Haus ist voll!'],['cover','Schau genau hin und decke eine Kammer zu.']];
let rec=null,recKey=null;
async function toggleRec(k){
  if(rec&&rec.state==='recording'){ rec.stop(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const r=new MediaRecorder(stream); const chunks=[]; rec=r; recKey=k;
    r.ondataavailable=e=>chunks.push(e.data);
    r.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const fr=new FileReader();
      fr.onload=()=>{
        voices[k]=fr.result;
        try{ localStorage.setItem(VKEY,JSON.stringify(voices)); }catch(e){ setMsg('Die Aufnahme ist zu lang zum Speichern. Bitte kürzer sprechen.'); delete voices[k]; }
        rec=null; recKey=null; renderPanel();
      };
      fr.readAsDataURL(new Blob(chunks,{type:r.mimeType||'audio/webm'}));
    };
    r.start(); renderPanel();
    setTimeout(()=>{ if(r.state==='recording') r.stop(); },6000);
  }catch(e){ rec=null; recKey=null; setMsg('Das Mikrofon ist hier nicht verfügbar. Öffne die Seite direkt im Browser und erlaube das Mikrofon.'); }
}

/* ---------- Bewegungssensor ---------- */
let last=null,lastShake=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity||e.acceleration; if(!a||a.x==null) return;
  gotMotion=true;
  if(last){
    const d=Math.abs(a.x-last.x)+Math.abs(a.y-last.y)+Math.abs(a.z-last.z);
    if(d>26&&Date.now()-lastShake>1300){ lastShake=Date.now(); shake(); }
  }
  last={x:a.x,y:a.y,z:a.z};
}
async function toggleMotion(){
  if(motionOn){ window.removeEventListener('devicemotion',onMotion); motionOn=false; renderPanel(); setMsg('Bewegungssensor aus.'); return; }
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=='granted'){ setMsg('Der Bewegungssensor wurde nicht erlaubt. Du kannst weiter mit dem Knopf schütteln.'); return; }
    }
    window.addEventListener('devicemotion',onMotion); motionOn=true; gotMotion=false; renderPanel();
    setMsg('Bewegungssensor an. Schüttle das Gerät!');
    setTimeout(()=>{ if(motionOn&&!gotMotion) setMsg('Es kommen keine Bewegungsdaten an. Öffne die Seite direkt im Browser (Safari oder Chrome) und versuche es noch einmal.'); },3000);
  }catch(e){ setMsg('Der Bewegungssensor ist hier nicht verfügbar. Öffne die Seite direkt im Browser.'); }
}

  S[k]=v; save();

}

/* ---------- Arbeitsblätter ----------
   Sechs Blätter passend zu den Ansichten. A4 in mm, Druck über den Browser.
   Schwarz-weiß-tauglich: linke (rote) Seite zusätzlich schraffiert. Erste Aufgabe = gelöstes Beispiel. */
const WSH={
  luecken:{view:'house',title:'Haus mit Lücken',icon:'house',text:'Welche Zahl fehlt? Schreib sie in das leere Zimmer. Beide Zimmer zusammen ergeben die Zahl im Dach.'},
  ganz:{view:'house',title:'Ganzes Zahlenhaus',icon:'house',text:'Finde alle Zerlegungen und schreib sie ins Haus. Eine steht schon da.'},
  geordnet:{view:'house',title:'Geordnetes Haus',icon:'house',text:'Das Haus ist geordnet: links immer eins mehr, rechts immer eins weniger. Welche Zahlen fehlen?'},
  bilder:{view:'box',title:'Box-Bilder',icon:'box',text:'Wie viele Kugeln liegen links, wie viele rechts? Schreib die Zahlen in die Kästchen.'},
  deckel:{view:'box',title:'Box mit Deckel',icon:'box',text:'Die Zahl auf der Box sagt, wie viele Kugeln es zusammen sind. Wie viele liegen links, wie viele rechts? Auch unter dem Deckel!'},
  protokoll:{view:'both',title:'Schüttel-Protokoll',icon:'both',text:'Schüttle die Box. Male die Kugeln in die Box und schreib die Zahlen darunter. Trag die Zerlegung ins Haus ein.'}
};
const WS={type:'luecken',types:['luecken'],ns:[6],zero:true,sol:true,heft:false,booklet:false};
let wsPages=[], wsUid=0, mem=null;
const RED='#C2382F', BLUE='#1F5FBF', INK='#1f2937', SOLC='#6b7280';
const shuf=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const decomp=(n,z)=>{ const r=[]; for(let a=z?0:1;a<=(z?n:n-1);a++) r.push({a,b:n-a}); return r; };
const exFirst=l=>{ const k=l.findIndex(t=>t.a>0&&t.b>0); if(k>0) [l[0],l[k]]=[l[k],l[0]]; return l; };
/* Gegen Wiederholungen (v. a. im Übungsheft): Zahlen kommen wie von einem Kartenstapel,
   erst wenn alle gewählten Zahlen dran waren, wieder von vorn. Pro Zahl werden selten
   benutzte Zeilen/Zerlegungen bevorzugt, und die Lücke wechselt die Seite. */
function wsStack(){ let pile=[], last=null; return ()=>{ if(!pile.length){ pile=shuf(WS.ns); if(pile.length>1&&pile[0]===last) pile.push(pile.shift()); } return last=pile.shift(); }; }
const pickRows=(n,k,kind='h',noZero=false,seen=null)=>{ const key=kind+n, c=mem.rows[key]||(mem.rows[key]={}); let cand=decomp(n,WS.zero).filter(x=>!noZero||(x.a>0&&x.b>0)); if(seen){ const f=cand.filter(x=>!seen.has(n+'-'+x.a)); if(f.length) cand=f; } const r=shuf(cand).sort((x,y)=>(c[x.a]||0)-(c[y.a]||0)).slice(0,k); r.forEach(x=>c[x.a]=(c[x.a]||0)+1); return r; };
const pickSide=key=>{ const p=mem.side[key], s=p?(p==='l'?'r':'l'):(Math.random()<.5?'l':'r'); mem.side[key]=s; return s; };

function wsGen(t,next){
  const single=WS.ns.length===1, n0=WS.ns[0], z=WS.zero;
  if(t==='luecken'){
    const ns=single?[n0,n0]:Array.from({length:6},next);
    return ns.map((n,i)=>{ const r=pickRows(n,single?99:4).map(x=>({...x,blank:pickSide(n+'-'+x.a)})); if(i===0){ exFirst(r); r[0].ex=true; } return {n,rows:r}; });
  }
  if(t==='ganz'){
    const ns=single?[n0,n0]:Array.from({length:3},next);
    return ns.map((n,i)=>{ const g=pickRows(n,1,'g')[0], cnt=decomp(n,z).length; return {n,rows:[{...g,blank:null,ex:i===0}].concat(Array.from({length:cnt-1},()=>({blank:'both'})))}; });
  }
  if(t==='geordnet'){
    const ns=single?[n0,n0]:Array.from({length:3},next);
    return ns.map((n,i)=>({n,rows:decomp(n,z).map((x,k)=>{ if(!k) return {...x,blank:null,ex:i===0}; const r=Math.random(); return {...x,blank:r<.25?null:pickSide('o'+n+'-'+x.a)}; })}));
  }
  if(t==='bilder'||t==='deckel'){
    let zeros=0; const seen=new Set(); // höchstens eine Zerlegung mit 0 pro Seite, keine Aufgabe doppelt
    const out=Array.from({length:8},()=>{ const n=single?n0:next(); let x=pickRows(n,1,'b',zeros>0&&n>1,seen)[0]; seen.add(n+'-'+x.a); if(x.a===0||x.b===0) zeros++; return {n,a:x.a,b:x.b,lid:t==='deckel'?pickSide('d'+n+'-'+x.a):null}; });
    exFirst(out); out[0].ex=true; return out;
  }
  const n=single?n0:next(), d=decomp(n,z), inner=d.filter(x=>x.a>0&&x.b>0), src=inner.length?inner:d;
  return {n,ex:src[rnd(src.length)],rows:d.length};
}

const hatch=id=>`<pattern id="${id}" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="2.4" fill="#fdeceb"/><line x1="0" y1="0" x2="0" y2="2.4" stroke="${RED}" stroke-width=".45" stroke-opacity=".55"/></pattern>`;
const lidPat=id=>`<pattern id="${id}" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="3" fill="#e5e7eb"/><line x1="0" y1="0" x2="0" y2="3" stroke="#6b7280" stroke-width=".9"/></pattern>`;
const tx=(x,y,v,fs,col,extra='')=>`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="${fs}" font-weight="700" fill="${col}" font-family="Andika,sans-serif" ${extra}>${v}</text>`;
const solTx=(x,y,v,fs)=>tx(x,y,v,fs,SOLC,'font-style="italic"');

function houseSVG(h,{cell=22,rowH=12,sol=false,pattern=false,emptyRows=0}={}){
  const id='h'+(++wsUid), W=2*cell, roof=cell*.85, rows=h.rows||[], nr=rows.length+emptyRows, H=roof+nr*rowH, mx=pattern?9:6;
  let g=`<defs>${hatch(id)}</defs>`;
  g+=`<polygon points="0,${roof} ${W/2},.6 ${W},${roof}" fill="#fff" stroke="${INK}" stroke-width=".8" stroke-linejoin="round"/>`+tx(W/2,roof*.64,h.n,roof*.42,INK);
  for(let k=0;k<nr;k++){
    const y=roof+k*rowH, r=rows[k]||{blank:'both'};
    g+=`<rect x="0" y="${y}" width="${cell}" height="${rowH}" fill="url(#${id})" stroke="${INK}" stroke-width=".45"/><rect x="${cell}" y="${y}" width="${cell}" height="${rowH}" fill="#fff" stroke="${INK}" stroke-width=".45"/>`;
    const hideA=!r.ex&&(r.blank==='l'||r.blank==='both'), hideB=!r.ex&&(r.blank==='r'||r.blank==='both'), fs=rowH*.6; // Beispiel immer ganz gelöst
    if(r.a!=null){ if(!hideA) g+=tx(cell/2,y+rowH/2,r.a,fs,RED); else if(sol) g+=solTx(cell/2,y+rowH/2,r.a,fs); }
    if(r.b!=null){ if(!hideB) g+=tx(cell*1.5,y+rowH/2,r.b,fs,BLUE); else if(sol) g+=solTx(cell*1.5,y+rowH/2,r.b,fs); }
    if(r.ex) g+=tx(-mx/2,y+rowH/2,'★',4.6,'#b45309');
    if(pattern&&k>0){ g+=tx(-mx/2-.5,y,'+1',3.1,RED)+tx(W+mx/2+.5,y,'−1',3.1,BLUE); }
  }
  g+=`<rect x="0" y="${roof}" width="${W}" height="${nr*rowH}" fill="none" stroke="${INK}" stroke-width=".9"/><line x1="${cell}" y1="${roof}" x2="${cell}" y2="${H}" stroke="${INK}" stroke-width=".9"/>`;
  return `<svg viewBox="${-mx} -1 ${W+2*mx} ${H+2}" style="width:${W+2*mx}mm;height:${H+2}mm;display:block">${g}</svg>`;
}

function boxSVG(t,{sol=false,empty=false,width=78}={}){
  const id='b'+(++wsUid), W=78, pad=2, dv=3, cw=(W-2*pad-dv)/2, tabW=14, tabH=7, ch=16, boxH=ch+2*pad, cs=10, cy=tabH+boxH+3, H=cy+cs+1;
  const top=tabH+pad, xl=pad, xr=pad+cw+dv;
  let g=`<defs>${hatch(id)}${lidPat(id+'l')}</defs>`;
  g+=`<rect x=".4" y="${tabH}" width="${W-.8}" height="${boxH}" rx="3" fill="#fff" stroke="${INK}" stroke-width=".8"/>`;
  g+=`<rect x="${W/2-tabW/2}" y=".4" width="${tabW}" height="${tabH+.4}" rx="2" fill="#fff" stroke="${INK}" stroke-width=".8"/><rect x="${W/2-tabW/2+.4}" y="${tabH-.2}" width="${tabW-.8}" height="1.2" fill="#fff"/>`+tx(W/2,tabH/2+.6,t.n,5,INK);
  g+=`<rect x="${xl}" y="${top}" width="${cw}" height="${ch}" rx="1.5" fill="url(#${id})"/><rect x="${xr}" y="${top}" width="${cw}" height="${ch}" rx="1.5" fill="#fff" stroke="#cbd5e1" stroke-width=".3"/>`;
  g+=`<line x1="${xl}" y1="${top+ch}" x2="${xl+cw}" y2="${top+ch}" stroke="${RED}" stroke-width="1.3"/><line x1="${xr}" y1="${top+ch}" x2="${xr+cw}" y2="${top+ch}" stroke="${BLUE}" stroke-width="1.3"/>`;
  g+=`<rect x="${pad+cw}" y="${top}" width="${dv}" height="${ch}" rx="1" fill="#9aa5b8"/>`;
  const balls=(x0,c)=>{ let s=''; const d=5.2, gap=.8, rw=5*d+4*gap; for(let i=0;i<c;i++){ const r=Math.floor(i/5), k=i%5; s+=`<circle cx="${x0+(cw-rw)/2+k*(d+gap)+d/2}" cy="${top+ch-1.6-d/2-r*(d+gap)}" r="${d/2}" fill="#F2B33D" stroke="#7a5200" stroke-width=".35"/>`; } return s; };
  if(!empty){ g+=balls(xl,t.a)+balls(xr,t.b); }
  if(t.lid){ const x=t.lid==='l'?xl:xr; g+=`<rect x="${x}" y="${top}" width="${cw}" height="${ch}" rx="1.5" fill="url(#${id}l)" stroke="${INK}" stroke-width=".5"/>`+tx(x+cw/2,top+ch/2,'?',10,INK); }
  [[xl+cw/2,t.a,RED,true],[xr+cw/2,t.b,BLUE,false]].forEach(([cx,v,col,left])=>{
    g+=`<rect x="${cx-cs/2}" y="${cy}" width="${cs}" height="${cs}" rx="1.2" fill="${left?`url(#${id})`:'#fff'}" stroke="${INK}" stroke-width=".6"/>`;
    if(v!=null){ if(t.ex) g+=tx(cx,cy+cs/2,v,cs*.62,col); else if(sol) g+=solTx(cx,cy+cs/2,v,cs*.62); }
  });
  const sc=width/W;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:${width}mm;height:${(H*sc).toFixed(2)}mm;display:block">${g}</svg>`;
}

const ICONS={
  house:`<svg class="sico" viewBox="0 0 40 40"><polygon points="4,16 20,4 36,16" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linejoin="round"/><rect x="8" y="16" width="24" height="20" fill="none" stroke="#1f2937" stroke-width="2.4"/><line x1="20" y1="16" x2="20" y2="36" stroke="#1f2937" stroke-width="2"/><line x1="8" y1="26" x2="32" y2="26" stroke="#1f2937" stroke-width="2"/></svg>`,
  box:`<svg class="sico" viewBox="0 0 40 40"><rect x="3" y="11" width="34" height="22" rx="4" fill="none" stroke="#1f2937" stroke-width="2.4"/><line x1="20" y1="11" x2="20" y2="33" stroke="#1f2937" stroke-width="2.4"/><circle cx="10" cy="27" r="3" fill="#1f2937"/><circle cx="15" cy="27" r="3" fill="#1f2937"/><circle cx="27" cy="27" r="3" fill="#1f2937"/></svg>`,
  both:`<svg class="sico" viewBox="0 0 40 40"><rect x="2" y="18" width="20" height="14" rx="3" fill="none" stroke="#1f2937" stroke-width="2"/><line x1="12" y1="18" x2="12" y2="32" stroke="#1f2937" stroke-width="2"/><circle cx="7" cy="28" r="2" fill="#1f2937"/><circle cx="16" cy="28" r="2" fill="#1f2937"/><polygon points="24,14 31,7 38,14" fill="none" stroke="#1f2937" stroke-width="2" stroke-linejoin="round"/><rect x="25" y="14" width="12" height="18" fill="none" stroke="#1f2937" stroke-width="2"/><line x1="31" y1="14" x2="31" y2="32" stroke="#1f2937" stroke-width="1.6"/></svg>`
};
const wsNums=(t,d)=>[...new Set(t==='protokoll'?[d.n]:d.map(x=>x.n))].sort((a,b)=>a-b);
const wsSub=nums=>(nums.length===1?'Zahl '+nums[0]:'Zahlen '+nums.join(', '))+(WS.zero?' · mit 0':' · ohne 0');

function wsBody(d,sol,t){
  const task=(i,ex,inner)=>`<div class="task${ex?' ex':''}"><span class="tno">${ex?'★ Beispiel':i}</span>${inner}</div>`;
  if(t==='luecken'||t==='ganz'||t==='geordnet'){
    // Häuser so groß wie möglich (Platz für Kinderschrift): Höhe ca. 195 mm, Breite 182 mm
    const cols=d.length>2?3:2, lines=d.length>3?2:1, maxR=Math.max(...d.map(h=>h.rows.length));
    const cell=cols===2?28:(lines===2?22:19), roof=cell*.85, avail=(lines===2?88:195)-roof;
    const opt={sol,pattern:t==='geordnet',cell,rowH:Math.max(9,Math.min(cols===2?17:14,Math.floor(avail/maxR*10)/10))};
    return `<div class="sgrid" style="grid-template-columns:repeat(${cols},1fr);row-gap:6mm">${d.map(h=>houseSVG(h,opt)).join('')}</div>`;
  }
  if(t==='bilder'||t==='deckel'){
    let k=0; return `<div class="sgrid" style="grid-template-columns:1fr 1fr">${d.map(b=>task(b.ex?0:++k,b.ex,boxSVG(b,{sol}))).join('')}</div>`;
  }
  // Schüttel-Protokoll: 8 leere Boxen + Haus mit leeren Zeilen
  let k=0; const boxes=Array.from({length:8},(_,i)=>i===0?task(0,true,boxSVG({n:d.n,a:d.ex.a,b:d.ex.b,ex:true},{width:58})):task(++k,false,boxSVG({n:d.n,a:null,b:null},{empty:true,width:58})));
  const house=houseSVG({n:d.n,rows:[{a:d.ex.a,b:d.ex.b,ex:true}]},{cell:22,rowH:Math.min(16,Math.floor((190-22*.85)/d.rows*10)/10),emptyRows:d.rows-1});
  return `<div style="display:grid;grid-template-columns:1fr auto;gap:5mm;align-items:start"><div class="sgrid" style="grid-template-columns:1fr 1fr;gap:3mm">${boxes.join('')}</div>${house}</div>`;
}
function wsPage(pg,sol,seite){
  const b=WSH[pg.type];
  return `<div class="sheet">
    <div class="nd"><span>Name: <span class="ln" style="width:62mm"></span></span><span>Datum: <span class="ln" style="width:32mm"></span></span></div>
    <div class="sh">${ICONS[b.icon]}<div><div class="ssub">Schüttelbox und Zahlenhaus · ${wsSub(wsNums(pg.type,pg.d))}</div><div class="stit">${b.title}${sol?' <em>– Lösung</em>':''}${seite?` <em style="font-size:5mm">Seite ${seite}</em>`:''}</div></div></div>
    <div class="stext">${b.text}</div>
    ${wsBody(pg.d,sol,pg.type)}
    <div class="sfoot"><span>Schüttelbox und Zahlenhaus · ${seite?'Übungsheft':'Arbeitsblatt'}</span><span>links rot (schraffiert) · rechts blau</span></div>
  </div>`;
}
function wsDeck(){
  const types=[...new Set(wsPages.map(p=>p.type))], one=types.length===1, b=WSH[types[0]];
  const nums=[...new Set(wsPages.flatMap(p=>wsNums(p.type,p.d)))].sort((x,y)=>x-y);
  const big=one?ICONS[b.icon]:ICONS.both;
  return `<div class="sheet"><div class="deck">
    <div class="ssub" style="margin-top:8mm">Schüttelbox und Zahlenhaus</div>
    <div style="font-size:15mm;font-weight:700;margin-top:4mm">Mein Übungsheft</div>
    <div style="width:40mm;height:40mm;margin:8mm 0 5mm">${big.replace('class="sico"','style="width:40mm;height:40mm"')}</div>
    <div style="font-size:8mm;font-weight:700">${one?b.title:'Zerlegen'}</div><div style="font-size:4.6mm;color:#374151">${wsSub(nums)}</div>
    <div style="font-size:6mm;margin-top:10mm;width:160mm;display:flex;gap:3mm;align-items:flex-end"><span>Name:</span><span class="ln" style="flex:1"></span></div>
    <div style="margin-top:10mm;width:160mm;display:flex;flex-direction:column;gap:4mm">${wsPages.map((p,i)=>`<div style="display:flex;align-items:center;gap:4mm;font-size:5mm;text-align:left"><span style="width:12mm;height:12mm;border-radius:50%;border:.7mm solid #1f2937;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none">${i+1}</span><span style="width:9mm;height:9mm;flex:none">${ICONS[WSH[p.type].icon].replace('class="sico"','style="width:9mm;height:9mm"')}</span><span style="width:52mm;flex:none">${WSH[p.type].title}</span><span class="ln" style="flex:1;margin-bottom:1.5mm"></span><span style="width:12mm;height:12mm;border-radius:2mm;border:.7mm solid #1f2937;flex:none"></span></div>`).join('')}</div>
  </div><div class="sfoot"><span>Schüttelbox und Zahlenhaus · Übungsheft</span><span>Datum auf die Linie, fertige Seite abhaken</span></div></div>`;
}
function wsNew(){
  mem={rows:{},side:{}}; const next=wsStack();
  if(WS.heft){ const ts=WS.types, cnt=Math.max(5,ts.length); wsPages=Array.from({length:cnt},(_,i)=>{ const type=ts[i%ts.length]; return {type,d:wsGen(type,next)}; }); }
  else wsPages=[{type:WS.type,d:wsGen(WS.type,next)}];
}
function wsRender(){
  const bar=$('#sbar');
  const btn=(on,label,act,extra='')=>`<button type="button" class="tool" aria-pressed="${on}" data-act="${act}" ${extra}>${label}</button>`;
  const on=k=>WS.heft?WS.types.includes(k):WS.type===k;
  const grp=v=>Object.entries(WSH).filter(([,x])=>x.view===v).map(([k,x])=>btn(on(k),(WS.heft&&on(k)?'✓ ':'')+x.title,'type:'+k)).join('');
  const nums=[2,3,4,5,6,7,8,9,10].map(n=>btn(WS.ns.includes(n),n,'n:'+n,'style="min-width:46px;justify-content:center"')).join('')
    +btn(false,'4 bis 10','range:4-10')+btn(false,'nur eine','one');
  const solPages=wsPages.filter(p=>p.type!=='protokoll').length;
  const pages=(WS.heft?1:0)+wsPages.length+(WS.sol?solPages:0);
  bar.innerHTML=`<div class="stop"><h2>Arbeitsblätter</h2><button type="button" class="tool print" data-act="print">🖨 Drucken</button><button type="button" class="tool" data-act="close">Schließen</button></div>
    <div class="srow"><span class="slab">Nur Haus</span>${grp('house')}</div>
    <div class="srow"><span class="slab">Nur Box</span>${grp('box')}</div>
    <div class="srow"><span class="slab">Box + Haus</span>${grp('both')}</div>
    ${WS.heft?'<p class="sinfo">Übungsheft: mehrere Blätter antippen – die Seiten wechseln sich ab.</p>':''}
    <div class="srow"><span class="slab">Zahlen</span>${nums}</div>
    <p class="sinfo">${WS.ns.length===1?'Nur die Zahl '+WS.ns[0]+'. Weitere Zahlen antippen = gemischt.':'Gemischt aus '+WS.ns.join(', ')+'. Jede Zahl kommt erst wieder, wenn alle dran waren.'}</p>
    <div class="srow"><span class="slab">Optionen</span>${btn(WS.zero,'Mit 0','zero:1')}${btn(!WS.zero,'Ohne 0','zero:0')}
      <label><input type="checkbox" data-act="sol" ${WS.sol?'checked':''} ${solPages?'':'disabled'}> Lösungsblatt</label>
      <label><input type="checkbox" data-act="heft" ${WS.heft?'checked':''}> Mini-Übungsheft (Deckblatt + ${Math.max(5,WS.types.length)} Seiten)</label>
      ${WS.heft?`<label><input type="checkbox" data-act="booklet" ${WS.booklet?'checked':''}> Als Broschüre (A5, gefaltet)</label>`:''}
      <button type="button" class="tool" data-act="new">🔀 Neue Zahlen</button></div>
    <p class="sinfo">${WS.heft&&WS.booklet?wsBookletInfo(solPages):`${pages} Seite${pages===1?'':'n'} · A4 hoch · Beim Drucken „Ränder: keine“ bzw. „Skalierung 100 %“ wählen. Links rot und schraffiert, damit es auch schwarz-weiß klappt.`}</p>`;
  const solList=WS.sol?wsPages.map((p,i)=>p.type==='protokoll'?'':wsPage(p,true,WS.heft?i+1:0)).filter(Boolean):[];
  const main=(WS.heft?[wsDeck()]:[]).concat(wsPages.map((p,i)=>wsPage(p,false,WS.heft?i+1:0)));
  const bk=WS.heft&&WS.booklet;
  $('#wsPageSize').textContent=bk?'@media print{@page{size:A4 landscape;margin:0}}':'';
  $('#spages').classList.toggle('landscape',bk);
  if(bk){
    // Broschüre: auf Vielfaches von 4 auffüllen, dann Falzreihenfolge (Bogen s: vorn N-1-2s | 2s, hinten 2s+1 | N-2-2s)
    const P=[...main]; while(P.length%4) P.push('<div class="sheet"></div>');
    const N=P.length, two=(l,r)=>`<div class="swrap"><div class="aland"><div class="a5">${l}</div><div class="a5">${r||''}</div></div></div>`;
    let out=''; for(let k=0;k<N/4;k++) out+=two(P[N-1-2*k],P[2*k])+two(P[2*k+1],P[N-2-2*k]);
    for(let k=0;k<solList.length;k+=2) out+=two(solList[k],solList[k+1]);
    $('#spages').innerHTML=out;
  } else $('#spages').innerHTML=main.concat(solList).map(h=>`<div class="swrap">${h}</div>`).join('');
  wsFit();
}
function wsBookletInfo(solPages){
  const N=Math.ceil((1+wsPages.length)/4)*4, sides=N/2, solS=WS.sol?Math.ceil(solPages/2):0;
  return `Broschüre: ${N/4} Blatt Papier, ${sides} Druckseiten (A4 quer), <b>beidseitig drucken, an der kurzen Kante wenden</b>, dann in der Mitte falten – Deckblatt außen, Seiten 1–${wsPages.length} der Reihe nach${N>1+wsPages.length?', am Ende '+(N-1-wsPages.length)+' leere Seite'+(N-2-wsPages.length?'n':''):''}.`
    +(solS?` Lösungen: Druckseite ${sides+1}${solS>1?'–'+(sides+solS):''} (einseitig, im Druckdialog nur diese Seiten wählen).`:'')
    +' Falls die Rückseiten auf dem Kopf stehen: „an der langen Kante wenden“ wählen.';
}
function wsFit(){ const sp=$('#spages'); if(!sp) return; const w=sp.clientWidth-24, mm=96/25.4; sp.style.setProperty('--f',Math.min(1,w/((sp.classList.contains('landscape')?297:210)*mm)).toFixed(4)); }
function openSheets(){
  WS.ns=[Math.max(2,Math.min(10,S.n))]; WS.zero=!!S.zero;
  WS.type=S.view==='house'?'luecken':S.view==='box'?'bilder':'protokoll'; WS.types=[WS.type];
  $('#settings').open=false; $('#sheets').hidden=false; document.body.style.overflow='hidden';
  wsNew(); wsRender();
}
function closeSheets(){ $('#sheets').hidden=true; document.body.style.overflow=''; }
$('#sbar').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return; const [a,v]=el.dataset.act.split(':');
  if(a==='print'){ window.print(); return; }
  if(a==='close'){ closeSheets(); return; }
  if(a==='sol'){ WS.sol=el.checked; wsRender(); return; }
  if(a==='booklet'){ WS.booklet=el.checked; wsRender(); return; }
  if(a==='heft'){ WS.heft=el.checked; if(WS.heft) WS.types=[WS.type]; else WS.type=WS.types[0]; }
  else if(a==='type'){
    if(WS.heft){ const has=WS.types.includes(v); if(has&&WS.types.length===1) return; WS.types=has?WS.types.filter(x=>x!==v):Object.keys(WSH).filter(k=>k===v||WS.types.includes(k)); WS.type=WS.types[0]; }
    else { WS.type=v; WS.types=[v]; }
  }
  else if(a==='n'){ const n=+v, has=WS.ns.includes(n); if(has&&WS.ns.length===1) return; WS.ns=has?WS.ns.filter(x=>x!==n):[...WS.ns,n].sort((x,y)=>x-y); }
  else if(a==='range'){ const [x,y]=v.split('-').map(Number); WS.ns=Array.from({length:y-x+1},(_,i)=>x+i); }
  else if(a==='one'){ WS.ns=[WS.ns[0]]; }
  else if(a==='zero') WS.zero=v==='1';
  else if(a!=='new') return;
  wsNew(); wsRender();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#sheets').hidden) closeSheets(); });
window.addEventListener('resize',wsFit);

renderPanel();
setN(Math.min(S.n,S.zr));
})();
</script>
</body>
</html>
